<svg width="680" height="316" viewBox="0 0 680 316" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lifecycle of trackChanges()</title>
<desc>Load data, trackChanges() snapshots a baseline, the user edits repeatedly, then the flow wraps down to commit or revert, and finally submits currentValues() or changes() to the API.</desc>
<style>
svg {
  --gray-fill:#F1EFE8; --gray-stroke:#5F5E5A; --gray-title:#3A3934; --gray-sub:#5F5E5A;
  --purple-fill:#EEEDFE; --purple-stroke:#534AB7; --purple-title:#3C3489; --purple-sub:#534AB7;
  --teal-fill:#E1F5EE; --teal-stroke:#0F6E56; --teal-title:#085041; --teal-sub:#0F6E56;
  --line:#8A8880; --note:#6B6A63;
}
@media (prefers-color-scheme: dark) {
  svg {
    --gray-fill:#2C2C2A; --gray-stroke:#8E8C83; --gray-title:#E7E5DC; --gray-sub:#B4B2A9;
    --purple-fill:#26215C; --purple-stroke:#9089DA; --purple-title:#DEDCFB; --purple-sub:#AFA9EC;
    --teal-fill:#04342C; --teal-stroke:#4FBE97; --teal-title:#CFF1E4; --teal-sub:#5DCAA5;
    --line:#9A988F; --note:#A6A49A;
  }
}
text { font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
.box { rx: 8px; stroke-width: 1px; }
.box-gray { fill: var(--gray-fill); stroke: var(--gray-stroke); }
.box-purple { fill: var(--purple-fill); stroke: var(--purple-stroke); }
.box-teal { fill: var(--teal-fill); stroke: var(--teal-stroke); }
.title { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.sub { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
.t-gray { fill: var(--gray-title); } .s-gray { fill: var(--gray-sub); }
.t-purple { fill: var(--purple-title); } .s-purple { fill: var(--purple-sub); }
.t-teal { fill: var(--teal-title); } .s-teal { fill: var(--teal-sub); }
.arrow { stroke: var(--line); stroke-width: 1.5px; fill: none; }
.note { font-size: 12px; fill: var(--note); text-anchor: middle; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="220" y1="104" x2="240" y2="104" class="arrow" marker-end="url(#arrow)"/>
<line x1="420" y1="104" x2="440" y2="104" class="arrow" marker-end="url(#arrow)"/>
<line x1="530" y1="132" x2="530" y2="220" class="arrow" marker-end="url(#arrow)"/>
<line x1="440" y1="248" x2="420" y2="248" class="arrow" marker-end="url(#arrow)"/>

<text class="note" x="530" y="60">↻ edits repeat</text>

<g>
  <rect class="box box-gray" x="40" y="76" width="180" height="56"/>
  <text class="title t-gray" x="130" y="94">Load data</text>
  <text class="sub s-gray" x="130" y="112">signal.set(initial)</text>
</g>

<g>
  <rect class="box box-purple" x="240" y="76" width="180" height="56"/>
  <text class="title t-purple" x="330" y="94">trackChanges()</text>
  <text class="sub s-purple" x="330" y="112">snapshot baseline</text>
</g>

<g>
  <rect class="box box-teal" x="440" y="76" width="180" height="56"/>
  <text class="title t-teal" x="530" y="94">User edits</text>
  <text class="sub s-teal" x="530" y="112">signal.update()</text>
</g>

<g>
  <rect class="box box-teal" x="440" y="220" width="180" height="56"/>
  <text class="title t-teal" x="530" y="238">commit()/revert()</text>
  <text class="sub s-teal" x="530" y="256">keep or undo it</text>
</g>

<g>
  <rect class="box box-gray" x="180" y="220" width="240" height="56"/>
  <text class="title t-gray" x="300" y="238">Submit to API</text>
  <text class="sub s-gray" x="300" y="256">currentValues() or changes()</text>
</g>
</svg>
